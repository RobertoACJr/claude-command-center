# Gera os instaladores em máquinas Windows e Ubuntu do GitHub e publica na página de Releases.
#
# - Push na main: gera e testa. Se a versão do package.json ainda não tem Release (ex: subiu de 0.7.0 para 0.8.0),
#   cria a Release v<versão> sozinha com os instaladores. Se já existe, só gera os artefatos.
# - Tag v* ou Release publicada pela página do GitHub: publica nessa tag.
# - Manual pela aba Actions: só artefatos, nunca publica.
name: Instaladores

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            files: |
              release/*/*.deb
              release/*/*.AppImage
              release/*/latest-linux.yml
          - os: windows-latest
            script: build:win
            files: |
              release/*/*.exe
              release/*/*.exe.blockmap
              release/*/latest.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes dos módulos
        run: npm test

      - name: Gerar instalador
        run: npm run ${{ matrix.script }}

      - name: Teste de fumaça (abre o app empacotado)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a --server-args="-screen 0 1440x900x24" node scripts/smoke-test.mjs

      - name: Teste de fumaça (abre o app empacotado)
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.mjs

      - name: Prints do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-${{ matrix.os }}
          path: smoke-*.jpg
          if-no-files-found: ignore

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publicar Release
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decidir a tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v="v$(node -p "require('./package.json').version")"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $v já existe — nada a publicar (suba a versão no package.json para lançar outra)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Criando a Release $v"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar instaladores
        if: steps.tag.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: dist-release
          merge-multiple: true

      - name: Publicar
        if: steps.tag.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Claude Command Center ${{ steps.tag.outputs.name }}
          files: dist-release/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
