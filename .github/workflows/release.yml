# Gera os instaladores em máquinas Windows e Ubuntu do GitHub e publica na página de Releases.
# Dispara ao enviar uma tag de versão (git tag v0.6.0 && git push origin v0.6.0)
# ou manualmente pela aba Actions (sem publicar release, só artefatos).
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            files: |
              release/*/*.deb
              release/*/*.AppImage
          - os: windows-latest
            script: build:win
            files: |
              release/*/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Gerar instalador
        run: npm run ${{ matrix.script }}

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
