# Gera os instaladores em máquinas Windows e Ubuntu do GitHub e publica na página de Releases.
# Dispara ao enviar uma tag de versão (git tag v0.6.0 && git push origin v0.6.0),
# ao publicar uma Release pela página do GitHub (Releases → Draft a new release → tag nova v0.6.0),
# ou manualmente pela aba Actions (sem publicar release, só artefatos).
name: Instaladores

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            files: |
              release/*/*.deb
              release/*/*.AppImage
              release/*/latest-linux.yml
          - os: windows-latest
            script: build:win
            files: |
              release/*/*.exe
              release/*/*.exe.blockmap
              release/*/latest.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Gerar instalador
        run: npm run ${{ matrix.script }}

      - name: Teste de fumaça (abre o app empacotado)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a --server-args="-screen 0 1440x900x24" node scripts/smoke-test.mjs

      - name: Teste de fumaça (abre o app empacotado)
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.mjs

      - name: Prints do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-${{ matrix.os }}
          path: smoke-*.jpg
          if-no-files-found: ignore

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
